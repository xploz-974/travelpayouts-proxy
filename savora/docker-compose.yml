services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: savora
      POSTGRES_PASSWORD: savora
      POSTGRES_DB: savora
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro   # exécute 001_schema.sql puis 002_seed.sql
volumes:
  pgdata:
